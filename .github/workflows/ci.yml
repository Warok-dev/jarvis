name: CI

on:
  push:
    branches: [main]
  pull_request:

# Lecture seule : la CI ne publie ni ne déploie rien.
permissions:
  contents: read

jobs:
  typescript:
    name: Worker, fonctions et app web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Typage du worker (partagé avec les Edge Functions)
        run: npx tsc -p services/worker --noEmit
      - name: Tests (parseur iCal, Web Push RFC 8291, notifications)
        run: npm test -w @jarvis/worker
      - name: Build de l'app web
        run: npm run build:web

  desktop:
    name: App de bureau (Tauri)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build:web
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Tests (signatures HMAC, exécuteur, temps réel, rééchantillonnage, mot d’activation)
        run: cargo test --lib --manifest-path apps/desktop/src-tauri/Cargo.toml
