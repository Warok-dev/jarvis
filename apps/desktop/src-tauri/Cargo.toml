[package]
name = "jarvis-desktop"
version = "0.1.0"
description = "Jarvis : assistant personnel, application de bureau"
edition = "2021"

[lib]
name = "jarvis_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"

[profile.release]
# Binaire léger : Jarvis tourne en permanence.
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
